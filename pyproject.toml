[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollm-bot"
version = "1.0.0"
description = "A privacy-aware, locally hosted RAG assistant for open-source contributors"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "OSS Let's Connect"}]
dependencies = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-telegram-bot>=22.8,<23",
  "PyYAML>=6.0,<7",
  "qdrant-client>=1.12,<2",
  "tenacity>=9,<10",
  "fastembed>=0.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
ollm = "ollm.main:main"
ollm-index = "ollm.cli:index_main"
ollm-ask = "ollm.cli:ask_main"
ollm-check = "ollm.cli:check_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
