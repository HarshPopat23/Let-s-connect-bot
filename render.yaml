services:
  - type: web
    name: let-s-connect-bot
    runtime: python
    plan: free
    buildCommand: pip install -e . && python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5', cache_dir='/tmp/fastembed', threads=1)"
    startCommand: ollm-index && ollm
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: fastembed
      - key: FASTEMBED_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: FASTEMBED_THREADS
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: MODEL_EASY
        value: openai/gpt-oss-20b
      - key: MODEL_STANDARD
        value: openai/gpt-oss-120b
      - key: MODEL_COMPLEX
        value: openai/gpt-oss-120b
      - key: HF_HOME
        value: /tmp/fastembed/hf
      - key: FASTEMBED_CACHE_PATH
        value: /tmp/fastembed
      - key: HF_HUB_DISABLE_SYMLINKS_WARNING
        value: "1"
      - key: HF_HUB_ENABLE_HF_TRANSFER
        value: "0"


