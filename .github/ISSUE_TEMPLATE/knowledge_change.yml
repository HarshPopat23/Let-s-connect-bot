name: Knowledge correction or addition
description: Improve a grounded open-source guidance document
title: "knowledge: "
labels: [knowledge]
body:
  - type: input
    id: question
    attributes:
      label: User question this should answer
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current gap or incorrect guidance
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Authoritative public source
      placeholder: https://official.example/guide
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This proposal contains no raw chat, phone number, personal contact or private material.
          required: true

