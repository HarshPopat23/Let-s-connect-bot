name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q src scripts
      - name: Check that private exports were not committed
        run: |
          if find . -type f \( -iname '*.vcf' -o -iname '*whatsapp*chat*.txt' \) | grep -q .; then
            echo "Private export or contact file detected"
            exit 1
          fi

